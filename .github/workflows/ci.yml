name: CI

on:
  push:
    branches: [main, functionality]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - name: Export Supabase env
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "CRON_SECRET=test-cron-secret"
            echo "ROTAS_MAP_URL=http://127.0.0.1:9999"
            echo "NEXT_PUBLIC_ROTAS_MAP_URL=http://127.0.0.1:9999"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run test:integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [quality, integration, build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - name: Export Supabase env
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "CRON_SECRET=test-cron-secret"
            echo "ROTAS_MAP_URL=http://127.0.0.1:9999"
            echo "NEXT_PUBLIC_ROTAS_MAP_URL=http://127.0.0.1:9999"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
